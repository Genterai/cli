name: protect-instructions
# The agent policy (CLAUDE.md, AGENTS.md, everything in .claude/ and this workflow) is written by people only. A pull
# request from an agent branch (claude/**) must not change it; people change it on their own branches. The same rule
# blocks agents locally through .claude/settings.json (deny rules and the protect-instructions hook).
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  check:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const policy = (n) => /(^|\/)(CLAUDE|AGENTS)\.md$/i.test(n) || /^\.claude\//.test(n) || n === '.github/workflows/protect-instructions.yml';
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: context.issue.number, per_page: 100 });
            const hit = files.filter((f) => [f.filename, f.previous_filename].some((n) => n && policy(n)));
            if (hit.length) core.setFailed(`An agent branch must not change the agent policy: ${hit.map((f) => f.filename).join(', ')}. CLAUDE.md, AGENTS.md and .claude/ are changed by people only.`);
            else core.info('The agent policy is untouched.');
