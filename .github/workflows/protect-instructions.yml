name: protect-instructions
# CLAUDE.md and AGENTS.md are the people's instructions to agents. A pull request from an agent branch
# (claude/**) must not change them; people change them on their own branches. The same rule blocks
# agents locally through .claude/settings.json (deny rules and the protect-instructions hook).
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  check:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: context.issue.number, per_page: 100 });
            const hit = files.filter((f) => [f.filename, f.previous_filename].some((n) => n && /(^|\/)(CLAUDE|AGENTS)\.md$/i.test(n)));
            if (hit.length) core.setFailed(`An agent branch must not change ${hit.map((f) => f.filename).join(', ')}: CLAUDE.md and AGENTS.md are changed by people only.`);
            else core.info('CLAUDE.md and AGENTS.md are untouched.');
