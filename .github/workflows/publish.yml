# Publishes genter-cli to npm when a GitHub release is published (tag v<version of package.json>).
# Needs either npm trusted publishing set up for this repository and workflow on npmjs.com, or an NPM_TOKEN secret.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, registry-url: "https://registry.npmjs.org", cache: npm }
      - name: The tag is the package's version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Installs with nothing else and answers with no key
        run: |
          npm pack
          mkdir -p /tmp/try && cd /tmp/try && npm init -y >/dev/null && npm i "$GITHUB_WORKSPACE"/genter-cli-*.tgz
          test "$(ls node_modules | wc -l)" = 1
          mkdir docs && printf '# Deploy\n\nWe deploy on Thursday.\n' > docs/deploy.md
          GENTER_HOME=/tmp/try/.genter npx genter ask "when do we deploy" | grep -q Thursday
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
