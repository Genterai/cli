name: test
# The repository's tests on every pull request (Genterai/specs how/engineering/testing.md), on every Node version
# package.json promises (engines: >=20), and a check of what the backend and the command use: every entry in
# "exports" imports, and `genter` starts and prints its usage.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm test
      - name: Every export imports
        run: |
          node --input-type=module -e "import p from './package.json' with { type: 'json' }; for (const e of Object.values(p.exports)) await import(e)"
      - name: The command starts
        run: node bin/genter.js
