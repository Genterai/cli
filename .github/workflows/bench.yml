name: bench
# DriftBench in public, every week and on demand (Genterai/specs quality/driftbench.md, scheduled-run): the arms that need
# no key (genter, an index built once, an index re-synced every 15 and every 60 minutes) and what it takes, on a fresh
# runner. The results are kept as an artifact of the run. The run fails when genter answers any stale fact after the
# edits, at any time after them, or its current share falls more than 5 points below the README's. It does not run on
# pull requests: whether it blocks a merge is not decided.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bench
  cancel-in-progress: false
jobs:
  driftbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      # No npm ci: the benchmark and genter need no package.
      - name: The dataset is consistent
        run: node bench/drift/check.mjs
      - name: DriftBench, no key
        run: |
          mkdir -p out
          node bench/drift/run.mjs --out "out/driftbench-$(date -u +%F).json" --md "out/driftbench-$(date -u +%F).md" --guard README.md
      - name: Report
        if: ${{ !cancelled() }}
        run: cat out/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: driftbench-${{ github.run_number }}
          path: out/
          retention-days: 90
