name: spec-check
# Product-code PRs state how they relate to Genterai/specs (governance/spec-repository.md there).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test .github/scripts/spec-check.test.mjs
      - name: List changed files
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, per_page: 100 })
            core.setOutput('list', files.map((f) => f.filename).join('\n'))
      - name: Check Specs line
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_FILES: ${{ steps.files.outputs.list }}
          SPEC_PATHS: |
            ^src/
            ^bin/
        run: node .github/scripts/spec-check.mjs
